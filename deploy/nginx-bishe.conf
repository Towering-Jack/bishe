# ============================================================================
# bishe 前端静态站 + 后端接口反向代理
# ============================================================================
# 用法：
#   1. 把 dist 目录里的内容整个传到服务器，例如 /usr/share/nginx/bishe
#   2. 把本文件放到 /etc/nginx/conf.d/bishe.conf（或 sites-available 并软链）
#   3. 按下面注释改掉 root 与后端地址
#   4. nginx -t 检查语法，然后 systemctl reload nginx
#
# 这套配置和前端默认的 apiBase='/api' 是配套的：
#   浏览器请求 /api/login  ->  nginx 去掉 /api 前缀  ->  后端 127.0.0.1:9527/login
# 全程同源，因此不存在跨域，也不需要在后端加任何 CORS 配置。
# ============================================================================

server {
    listen       80;
    server_name  _;          # 换成你的域名，例如 property.example.com

    # 前端产物所在目录（dist 里的内容直接放这里）
    root  /usr/share/nginx/bishe;
    index index.html;

    charset utf-8;
    client_max_body_size 100m;   # 与后端 spring.servlet.multipart.max-file-size 保持一致

    access_log  /var/log/nginx/bishe.access.log;
    error_log   /var/log/nginx/bishe.error.log;

    # ------------------------------------------------------------------
    # gzip：构建时已生成 .gz，这里优先用现成的，没有再回退到实时压缩
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_static on;          # 需要 ngx_http_gzip_static_module（官方包默认已编译进去）

    # ------------------------------------------------------------------
    # 接口反向代理
    # 注意 proxy_pass 结尾的 “/” 不能少：它负责去掉 /api 前缀
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:9527/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # 大文件上传/导出，别被默认 60s 卡掉
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
        proxy_request_buffering off;
    }

    # ------------------------------------------------------------------
    # 图片目录 /imagesWeb/xx.jpg
    # 前端只把文件名存进数据库，显示时拼 /imagesWeb/ 前缀。
    # 后端代码里没有这个映射（只有 /images/** -> MinIO），所以必须在这里配。
    #
    # 二选一（先试 A，不行再试 B）：
    #   A. 文件在 MinIO 的 property-cos 桶里（后端 /images/** 转发到的地方）
    #   B. 文件就是服务器上的一个普通目录
    # ------------------------------------------------------------------
    location /imagesWeb/ {
        # --- 方案 A：转发到 MinIO（和后端 minio.endpoint/bucket-name 对应）---
        # 优点是 MinIO 端口不必对外暴露。
        proxy_pass http://1.14.170.236:19000/property-cos/;
        proxy_set_header Host $host;

        # --- 方案 B：服务器本地目录（把上面两行注释掉，用下面这行）---
        # alias /usr/share/nginx/bishe-images/;

        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ------------------------------------------------------------------
    # 带内容哈希的构建产物：可以长期强缓存
    # ------------------------------------------------------------------
    location ~* ^/static/(js|css)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* ^/static/(img|avatar|file|fonts|media)/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # static/less/ 下的 .less 会被运行时当作样式表加载，这里保证能取到
    location ~* ^/static/(less|utils)/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # 部署配置：绝对不要缓存，否则改了 apiBase 刷新也不生效
    # ------------------------------------------------------------------
    location = /static/app-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # index.html 同样不缓存，避免发版后用户拿到旧入口
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # ------------------------------------------------------------------
    # SPA 兜底
    # 本项目用的是 hash 路由（地址形如 /#/login），正常不需要 history 回退；
    # 这里保留兜底，直连任意路径都不会 404。
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件不必对外
    location ~ /\. {
        deny all;
    }
}
