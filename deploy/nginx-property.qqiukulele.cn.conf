# ============================================================================
#  property.qqiukulele.cn —— 对用户现有宝塔 nginx 配置的最小改动版
# ============================================================================
#  说明：你服务器上那份配置基本是对的，只需要改 3 处（下面用 【改N】 标出）。
#  本文件是把你的配置整理成可直接对照的版本，不要整个覆盖，
#  照标注改你自己那份即可（宝塔面板里改也行）。
#
#  关键结论：前端已改成两个可配置前缀，现在是
#      apiBase   = '/propertyCosApi'    -> 后端 9527
#      imageBase = '/propertyCosImg'    -> MinIO property-cos 桶
#  你原有的 location 已经正好覆盖这两个前缀，所以【不需要新增 location】。
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    http2 on;
    server_name property.qqiukulele.cn;
    index index.html index.htm default.htm default.html;

    # 【改1】确认目录名。你现在写的是 distDL，
    #   请把打好的 dist 里的内容放到这个目录下，使该目录直接包含 index.html 与 static/
    root /www/wwwroot/property/distDL;

    include /www/server/panel/vhost/nginx/extension/property.qqiukulele.cn/*.conf;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/property.qqiukulele.cn.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ( $uri ~ /\.well-known/ ) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END
    ssl_certificate    /www/server/panel/vhost/cert/property.qqiukulele.cn/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/property.qqiukulele.cn/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    quic_retry on;
    quic_gso on;
    ssl_early_data on;
    error_page 497  https://$host$request_uri;
    #SSL-END

    # ------------------------------------------------------------------
    # 【改2】gzip。
    #   前端构建时已经生成了 .js.gz / .css.gz，但你现在没开 gzip，
    #   那些 .gz 完全没被用到，等于白白多传了一半体积。
    #   加上这三行即可让 nginx 直接发预压缩文件（省 CPU）。
    #   若你的 nginx 没编译 gzip_static 模块，`nginx -t` 会报错，
    #   那就只留前两行。
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_static on;

    client_max_body_size 100m;   # 与后端 multipart 的 100MB 对齐

    #REWRITE-START
    include /www/server/panel/vhost/rewrite/html_property.qqiukulele.cn.conf;
    #REWRITE-END

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    location ~ \.well-known{
        allow all;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # ------------------------------------------------------------------
    # 【改3】这里的正则写错了，是死代码，从未生效。
    #   你写的是：  location ~ .*\\.(js|css)?$      ← 两个反斜杠 = 字面反斜杠
    #   正确写法：  location ~* \.(js|css)$
    #   同时建议：
    #     - 加上 $ 与更精确的扩展名，避免把 /static/js/xxx 这类目录也匹配进来
    #     - app-config.js 不能缓存，否则改了地址刷新不生效
    # ------------------------------------------------------------------
    location ~* \.(js|css)$ {
        expires 12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    # 部署配置绝对不缓存（放在上面正则之前用 = 精确匹配，优先级更高）
    location = /static/app-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # 带内容哈希的产物可以长缓存
    location ~* ^/static/(js|css)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri /index.html;
    }

    # ------------------------------------------------------------------
    # 图片：前端请求 /propertyCosImg/imagesWeb/<文件名>
    # 注意 proxy_pass 末尾的 / 会把 /propertyCosImg/imagesWeb/ 去掉，
    # 所以这里要保留 "/property-cos/" 作为目标桶路径。你原来的写法是对的。
    # ------------------------------------------------------------------
    location /propertyCosImg/imagesWeb/ {
        proxy_pass http://1.14.170.236:19000/property-cos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 文件上传：前端 action = /propertyCosApi/file/fileUpload/
    # 已由下面 /propertyCosApi/ 覆盖；/propertyCosFile/ 保留兼容旧地址。
    location /propertyCosFile/ {
        proxy_pass http://127.0.0.1:9527/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100m;
    }

    # 后端接口主入口（登录、菜单、增删改查、上传、人脸注册全都走这里）
    location /propertyCosApi/ {
        proxy_pass http://127.0.0.1:9527/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /propertyCosFace/ {
        proxy_pass http://127.0.0.1:9527/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    access_log  /www/wwwlogs/property.qqiukulele.cn.log;
    error_log   /www/wwwlogs/property.qqiukulele.cn.error.log;
}
