# ============================================================================
#  property.qqiukulele.cn  完整站点配置
#  直接粘贴覆盖宝塔里那个 server 块即可（宝塔：网站 -> 设置 -> 配置文件）
# ============================================================================
#  改动点（相对你原来的配置）：
#    1. 原来 .js/.css 的 location 正则写成了 .*\\.(js|css)?$（两个反斜杠），
#       在 nginx 里是「字面反斜杠」，匹配不到任何文件，一直是死代码 —— 已修正。
#    2. 补上 gzip / gzip_static：dist 里已生成 57 个 .gz，不开 gzip 等于白做。
#    3. 补上 client_max_body_size：与后端 100MB 上传上限对齐。
#    4. app-config.js 设成不缓存：否则改了地址刷新不生效。
#    5. 去掉了 rewrite 引用（hash 路由不需要；且那个文件里若有 catch-all 规则
#       会干扰排查）。如果宝塔要求保留，见文件末尾的说明。
#
#  接口与图片前缀（与前端 dist/static/app-config.js 一一对应，不要改错）：
#     apiBase   = /propertyCosApi    -> 代理到后端 127.0.0.1:9527
#     imageBase = /propertyCosImg    -> 代理到 MinIO 129.204.58.109:19000/property-cos
#
#  proxy_pass 结尾的 "/" 非常关键，它负责去掉前缀：
#     浏览器 /propertyCosApi/login  ->  后端收到 /login
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    http2 on;

    server_name property.qqiukulele.cn;

    index index.html index.htm default.htm default.html;

    # 前端产物目录：dist 里的内容直接放这里，使该目录下就是 index.html + static/
    root /www/wwwroot/property/distDL;

    include /www/server/panel/vhost/nginx/extension/property.qqiukulele.cn/*.conf;

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除并保持这段设置在优先级高的位置
    include /www/server/panel/vhost/nginx/well-known/property.qqiukulele.cn.conf;
    #CERT-APPLY-CHECK--END

    # ------------------------------------------------------------------
    # gzip：直接发送构建时预压缩好的 .gz，省 CPU
    # 若你的 nginx 未编译 gzip_static 模块，`nginx -t` 会报
    # "unknown directive gzip_static"，把那一行删掉即可，其余不受影响。
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_static on;

    # 与后端 spring.servlet.multipart.max-file-size=100MB 对齐
    client_max_body_size 100m;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ( $uri ~ /\.well-known/ ) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END
    ssl_certificate    /www/server/panel/vhost/cert/property.qqiukulele.cn/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/property.qqiukulele.cn/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    ssl_early_data on;
    error_page 497  https://$host$request_uri;
    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    #error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    # ------------------------------------------------------------------
    # 后端接口反向代理（登录、菜单、所有增删改查、上传、人脸注册都走这里）
    # 用 ^~ 前缀匹配，确保它不会被后面的正则 location 抢走
    # ------------------------------------------------------------------
    location ^~ /propertyCosApi/ {
        proxy_pass http://127.0.0.1:9527/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        client_max_body_size 100m;
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
        proxy_request_buffering off;
    }

    # 兼容旧地址：前端已不再使用，留着不影响；想干净可整段删掉
    location ^~ /propertyCosFile/ {
        proxy_pass http://127.0.0.1:9527/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100m;
    }

    # 兼容旧地址：前端人脸注册已改走 /propertyCosApi/cos/face/registered/
    location ^~ /propertyCosFace/ {
        proxy_pass http://127.0.0.1:9527/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ------------------------------------------------------------------
    # 图片：前端请求 /propertyCosImg/imagesWeb/<文件名>
    # proxy_pass 末尾的 / 会去掉 /propertyCosImg/imagesWeb/，
    # 所以要保留 "property-cos/" 作为 MinIO 桶路径。
    #
    # !! 注意地址必须与 application.yml 里的 minio.endpoint 一致 !!
    #    迁移服务器后这里最容易漏改：旧 IP 还在的话，nginx 会一直等到
    #    proxy 超时（浏览器表现为图片一直转圈 / 加载失败），
    #    而 MinIO 本身是正常的。
    #
    #   MinIO 与 nginx 同机  ->  用 127.0.0.1:19000（更快，不出网）
    #   MinIO 在另一台机器    ->  用那台机器的内网/公网地址
    # ------------------------------------------------------------------
    location ^~ /propertyCosImg/imagesWeb/ {
        proxy_pass http://129.204.58.109:19000/property-cos/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 连接与读取超时：留短一点，出问题时快速失败并写日志，
        # 而不是让浏览器干等 60 秒
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ------------------------------------------------------------------
    # 部署配置：绝对不能缓存，否则改了 apiBase 刷新不生效
    # = 精确匹配优先级最高，不受下面正则影响
    # ------------------------------------------------------------------
    location = /static/app-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # index.html 也不缓存，避免发版后用户拿到旧入口
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # ------------------------------------------------------------------
    # 带内容哈希的构建产物：可长期强缓存
    # ------------------------------------------------------------------
    location ^~ /static/js/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ^~ /static/css/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ^~ /static/ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # 【原来是死代码，已修正】静态资源兜底缓存
    # 注意：这里用 $ 结尾并只匹配文件扩展名，避免误伤 /static/js/ 这类目录
    # ------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 禁止访问的文件或目录
    location ~ ^/(\.user\.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README\.md) {
        return 404;
    }

    # 一键申请SSL证书验证目录相关设置
    location ~ \.well-known {
        allow all;
    }

    # 禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # ------------------------------------------------------------------
    # SPA 兜底
    # 本项目是 hash 路由（地址形如 /#/login），正常不需要 history 回退；
    # 保留这行可让任意深链都返回首页而不是 404。
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log  /www/wwwlogs/property.qqiukulele.cn.log;
    error_log   /www/wwwlogs/property.qqiukulele.cn.error.log;
}

# ============================================================================
#  如果宝塔坚持要求保留 rewrite 引用
# ============================================================================
#  在 server 块内、最下面加回这一行即可：
#      include /www/server/panel/vhost/rewrite/html_property.qqiukulele.cn.conf;
#
#  但请先打开那个文件看一眼：如果里面有类似
#      location / { try_files $uri $uri/ /index.html; }
#      rewrite ^(.*)$ /index.html break;
#  这类 catch-all 规则，它会和上面的 location / 冲突（同名 location 会直接
#  报 duplicate location 错误）。hash 路由不需要伪静态，建议把那个文件清空。
#
#  另外注意：上面的接口/图片代理用的是 ^~ 前缀匹配，优先级高于正则 location，
#  所以即使 rewrite 文件里有 location ~ .* 这类规则，也不会抢走 /propertyCosApi/。
# ============================================================================
