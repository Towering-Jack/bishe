      exposure:
        include: ['httptrace', 'metrics']


# 定时任务（Quartz）
# 注意：这一段必须是顶格的（与 spring: / management: 同级）。
# 之前它被缩进在 management: 下面，实际变成了 management.quartz.*，
# 而 Spring Boot 只认根级的 quartz.*，导致 job-store-type / isClustered
# 全部没有生效（启动日志里会显示 Scheduler MyScheduler_$_NON_CLUSTERED started）。
quartz:
  # 任务持久化到数据库（QRTZ_* 表），重启后任务不丢失
  job-store-type: jdbc
  properties:
    org:
      quartz:
        scheduler:
          instanceName: MyScheduler
          instanceId: AUTO
        threadPool:
          class: org.quartz.simpl.SimpleThreadPool
          threadCount: 20
          threadPriority: 5
        jobStore:
          class: org.quartz.impl.jdbcjobstore.JobStoreTX
          driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
          tablePrefix: QRTZ_
          # 单机部署时 isClustered 留 false 更合适；多实例共用同一套 QRTZ_ 表才需要 true。
          # 这里保持你原来的值不变，只修正缩进。
          isClustered: true
          clusterCheckinInterval: 15000
          maxMisfiresToHandleAtATime: 1
          misfireThreshold: 12000
          useProperties: false

febs:
  # 是否异步记录用户操作日志
  openAopLog: true
  # 单次最大批量入库数量
  max:
    batch:
      insert:
        num: 1000
  shiro:
    # 后端免认证接口 url
    anonUrl: /login,/logout/**,/regist,/user/check/**,/file/**,/imagesWeb/**,/cos/payment-manage/ali/**,/cos/face/**
    # token有效期，单位秒
    jwtTimeOut: 3600

